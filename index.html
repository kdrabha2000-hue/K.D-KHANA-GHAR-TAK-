<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KD KA KHANA GHAR TAK</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding-bottom: 70px;
    }
    header {
      background-color: #8b0000;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-title { font-weight: bold; font-size: 1.1rem; }
    .cart-badge { background: #fff; color: #8b0000; padding: 2px 8px; border-radius: 12px; font-weight: bold; }
    
    .page { display: none; padding: 15px; }
    .page.active { display: block; }

    .food-card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn {
      background: #8b0000;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .form-box {
      max-width: 400px;
      margin: 30px auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #2b2b2b;
      border: 1px solid #333;
      color: #fff;
      border-radius: 5px;
    }

    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #000;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid #222;
    }
    nav button {
      background: none;
      border: none;
      color: #888;
      font-size: 12px;
      cursor: pointer;
    }
    nav button.active { color: #8b0000; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">K.D KA KHANA GHAR TAK</div>
    <div>🛒 <span class="cart-badge" id="cart-count">0</span></div>
  </header>

  <!-- HOME PAGE -->
  <div id="home-page" class="page active">
    <h2>Menu</h2>
    <br>
    <div class="food-card">
      <div>
        <h3>Special Thali</h3>
        <p>₹150</p>
      </div>
      <button class="btn" onclick="addToCart('Special Thali', 150)">Add to Cart</button>
    </div>
    <div class="food-card">
      <div>
        <h3>Chicken Biryani</h3>
        <p>₹200</p>
      </div>
      <button class="btn" onclick="addToCart('Chicken Biryani', 200)">Add to Cart</button>
    </div>
  </div>

  <!-- WATCHLIST PAGE -->
  <div id="watchlist-page" class="page">
    <h2>Watchlist / Favorites</h2>
    <br>
    <p style="color:#aaa;">Koi favorite item saved nahi hai.</p>
  </div>

  <!-- CART PAGE -->
  <div id="cart-page" class="page">
    <h2>Your Cart</h2>
    <br>
    <div id="cart-items">
      <p style="color:#aaa;">Cart khali hai.</p>
    </div>
  </div>

  <!-- ACCOUNT PAGE -->
  <div id="account-page" class="page">
    <div class="form-box">
      <h2>Customer / Admin Login</h2>
      <input type="email" id="email" placeholder="Email Address" value="kdrabha2000@gmail.com">
      <input type="password" id="password" placeholder="Password">
      <button class="btn" style="width:100%" onclick="handleLogin()">Login / Register</button>
      <p id="status" style="margin-top:15px; text-align:center; font-size:14px;"></p>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav>
    <button id="nav-home" class="active" onclick="showPage('home-page', 'nav-home')">🏠<br>Home</button>
    <button id="nav-watchlist" onclick="showPage('watchlist-page', 'nav-watchlist')">❤️<br>Watchlist</button>
    <button id="nav-cart" onclick="showPage('cart-page', 'nav-cart')">🛒<br>Cart</button>
    <button id="nav-account" onclick="showPage('account-page', 'nav-account')">👤<br>Account</button>
  </nav>

  <!-- Firebase Compat Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDDTFzD8eaxS6hsQ_W5akOWRWixyZdjkSo",
      authDomain: "kd-ka-khana-ghar-tak.firebaseapp.com",
      projectId: "kd-ka-khana-ghar-tak",
      storageBucket: "kd-ka-khana-ghar-tak.firebasestorage.app",
      messagingSenderId: "69933070653",
      appId: "1:69933070653:web:f9b93ba827d794bb376d54"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    let cartCount = 0;

    function showPage(pageId, navId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      
      document.getElementById(pageId).classList.add('active');
      document.getElementById(navId).classList.add('active');
    }

    function addToCart(itemName, price) {
      cartCount++;
      document.getElementById('cart-count').innerText = cartCount;
      alert(itemName + " Cart mein add ho gaya!");
    }

    function handleLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const status = document.getElementById('status');

      if (!email || !password) {
        status.innerText = "Kripya email aur password bharein.";
        return;
      }

      status.innerText = "Processing...";

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          status.innerText = "Login Successful!";
          alert("Login successful!");
        })
        .catch((error) => {
          if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
            auth.createUserWithEmailAndPassword(email, password)
              .then(() => {
                status.innerText = "Account Created & Logged In!";
                alert("Naya account ban gaya!");
              })
              .catch(err => status.innerText = "Error: " + err.message);
          } else {
            status.innerText = "Error: " + error.message;
          }
        });
    }
  </script>
</body>
</html>
