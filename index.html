<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K.D KA KHANA GHAR TAK</title>
  <!-- SwiperJS CSS (Banner Slider Ke Liye) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background-color: #121212; color: #fff; }
    .header { background: #e50914; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
    .swiper { width: 100%; height: 180px; margin-top: 10px; }
    .swiper-slide img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
    .container { padding: 15px; }
    .card { background: #1e1e1e; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .btn { background: #e50914; color: #fff; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">K.D KA KHANA GHAR TAK</div>

  <!-- Auto-Sliding Banner Section -->
  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><img src="https://via.placeholder.com/400x180/e50914/fff?text=Flat+50%25+OFF+On+First+Order" alt="Banner 1"></div>
      <div class="swiper-slide"><img src="https://via.placeholder.com/400x180/1e1e1e/fff?text=Fastest+Delivery+Ghar+Tak" alt="Banner 2"></div>
    </div>
    <div class="swiper-pagination"></div>
  </div>

  <!-- Menu Preview -->
  <div class="container">
    <h3>Top Dishes</h3>
    <div class="card">
      <div>
        <h4>Chicken Pakora</h4>
        <p>₹100</p>
      </div>
      <button class="btn">ADD +</button>
    </div>
  </div>

  <!-- SwiperJS Script -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    var swiper = new Swiper(".mySwiper", {
      autoplay: { delay: 3000, disableOnInteraction: false },
      pagination: { el: ".swiper-pagination", clickable: true },
      loop: true
    });
  </script>
</body>
</html>
