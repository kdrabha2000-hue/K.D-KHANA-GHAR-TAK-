<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KD KA KHANA GHAR TAK</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: #8b0000;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 1.2em;
    }
    .container {
      max-width: 400px;
      margin: 40px auto;
      padding: 20px;
      background: #1e1e1e;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #333;
      background: #2b2b2b;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #8b0000;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>K.D KA KHANA GHAR TAK</header>

  <div class="container">
    <h2>Login / Register</h2>
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">
    <button onclick="handleLogin()">Login / Register</button>
    <p id="status" style="margin-top:15px; text-align:center; font-size:14px;"></p>
  </div>

  <!-- Firebase Scripts (Compat Version for Web) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script>
    // Aapka Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDDTFzD8eaxS6hsQ_W5akOWRWixyZdjkSo",
      authDomain: "kd-ka-khana-ghar-tak.firebaseapp.com",
      projectId: "kd-ka-khana-ghar-tak",
      storageBucket: "kd-ka-khana-ghar-tak.firebasestorage.app",
      messagingSenderId: "69933070653",
      appId: "1:69933070653:web:f9b93ba827d794bb376d54"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function handleLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const status = document.getElementById('status');

      if (!email || !password) {
        status.innerText = "Kripya email aur password bharein.";
        return;
      }

      status.innerText = "Processing...";

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          status.innerText = "Login Successful!";
          alert("Login ho gaya!");
        })
        .catch((error) => {
          // Agar user nahi hai, toh account bana do
          if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
            auth.createUserWithEmailAndPassword(email, password)
              .then(() => {
                status.innerText = "Account Created & Logged In!";
                alert("Naya account ban gaya!");
              })
              .catch(err => status.innerText = "Error: " + err.message);
          } else {
            status.innerText = "Error: " + error.message;
          }
        });
    }
  </script>
</body>
</html>
